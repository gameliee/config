name: leak-scan
on: [push]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so every pushed commit gets scanned
      # Regex engine: known token formats. Free on personal-account repos.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Verification engine: flags credentials that actually authenticate.
      - uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown
