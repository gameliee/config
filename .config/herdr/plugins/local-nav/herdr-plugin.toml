id = "local-nav"
name = "Local Nav"
version = "0.2.0"
min_herdr_version = "0.7.3"
description = "Unified unread triage: jump to newest unread (finished or deferred); toggle deferred"
platforms = ["macos", "linux"]

[[actions]]
id = "jump-unread"
title = "Jump to newest unread agent (finished or deferred)"
contexts = ["workspace"]
command = ["bash", "jump-unread.sh"]

[[actions]]
id = "mark-deferred"
title = "Toggle deferred flag on focused agent"
contexts = ["workspace"]
command = ["bash", "mark-deferred.sh"]
